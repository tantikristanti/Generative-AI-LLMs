[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ciqual-search-engine-rag"
version = "1.0.0"
description = "Ciqual's food search engine and RAG system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.0",
    "datasets>=4.8.5",
    "fastapi>=0.136.1",
    "fastembed>=0.8.0",
    "gradio>=6.15.1",
    "jupyter>=1.1.1",
    "langchain>=1.3.2",
    "langchain-community>=0.4.2",
    "matplotlib>=3.10.9",
    "numpy>=2.4.5",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pgcli>=4.3.0",
    "pgvector>=0.4.2",
    "polars>=1.40.1",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.5.0",
    "sqlalchemy>=2.0.49",
    "tqdm>=4.67.3",
    "uv>=0.11.14",
    "uvicorn>=0.47.0",
    "xlrd>=2.0.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ciqual_etl*", "rag*"]   
